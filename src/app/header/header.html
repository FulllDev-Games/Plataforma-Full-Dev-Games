<header class="hero-header">
    
    <!-- Nav Bar -->
    <nav class="nav">
        <div class="nav__container">
            <div class="nav__menu">
                <a *ngFor="let item of menuItems" class="nav__item" [routerLink]="item.path"
                    routerLinkActive="nav__item--active" [routerLinkActiveOptions]="{ exact: item.path === '' }">
                    {{item.label}}
                </a>
            </div>
            <div class="nav__button">
                <a href="#" class="nav__cta">Registra-se</a>
            </div>
        </div>
    </nav>

    <!-- Card contagem regressiva-->
    <div class="countdown-card">
        <h2 class="countdown-card__title">LANÇAMENTO DO SERVIDOR</h2>
        <div class="countdown-card__container">
            <!-- Dias -->
            <div class="countdown-unit">
                <p class="countdown-label">Dias</p>
                <div class="countdown-number">03</div>
            </div>
            <!-- Horas -->
            <div class="countdown-unit">
                <p class="countdown-label">Horas</p>
                <div class="countdown-number">03</div>
            </div>
            <!-- Minutos -->
            <div class="countdown-unit">
                <p class="countdown-label">Minutos</p>
                <div class="countdown-number">03</div>
            </div>
            <!-- Segundos -->
            <div class="countdown-unit">
                <p class="countdown-label">Segundos</p>
                <div class="countdown-number">03</div>
            </div>
        </div>
    </div>
</header>
